spring:
  application:
    name: travel-backend

  profiles:
    default: dev

  jackson:
    deserialization:
      fail-on-null-for-primitives: false
      fail-on-unknown-properties: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${MAIL_STARTTLS:true}
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.ssl.enable]": ${MAIL_SSL_ENABLED:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}

app:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
  google:
    enabled: ${GOOGLE_AUTH_ENABLED:false}
    web-client-id: ${GOOGLE_WEB_CLIENT_ID:}
    challenge-ttl: ${GOOGLE_CHALLENGE_TTL:5m}
    link-ttl: ${GOOGLE_LINK_TTL:10m}
    link-url: ${GOOGLE_LINK_URL:https://example.invalid/google-link}
    allow-insecure-links: false

  auth:
    email-enabled: ${AUTH_EMAIL_ENABLED:false}
    from: ${AUTH_EMAIL_FROM:}
    verify-email-url: ${AUTH_VERIFY_EMAIL_URL:https://example.invalid/verify-email}
    reset-password-url: ${AUTH_RESET_PASSWORD_URL:https://example.invalid/reset-password}
    verification-ttl: ${AUTH_VERIFICATION_TTL:24h}
    reset-ttl: ${AUTH_RESET_TTL:30m}
    resend-cooldown: ${AUTH_RESEND_COOLDOWN:60s}
    allow-insecure-links: false

  jwt:
    secret-key: ${JWT_SECRET_KEY}
    refresh-key: ${JWT_REFRESH_KEY}

    access:
      expiration: 1800000 # 30 phút
    refresh:
      expiration: 604800000 # 7 ngày

  openapi:
    dev-url: ${OPENAPI_DEV_URL:http://localhost:${SERVER_PORT:8080}}

application:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}

  ai:
    active-provider: ${AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout-seconds: 30
      temperature: 0.4
      max-output-tokens: 4096

  weather:
    active-provider: ${WEATHER_PROVIDER:open-meteo}
    open-meteo:
      base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1}
      timeout-seconds: 10
      default-timezone: Asia/Ho_Chi_Minh

management:
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

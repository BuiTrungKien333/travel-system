spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    com.travel: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
spring:
  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN

# Khóa công khai chỉ dành cho test; production bắt buộc cung cấp biến môi trường.
app:
  media:
    cleanup-enabled: false
  cloudinary:
    cloud-name: test-cloud
    api-key: test-key
    api-secret: test-secret
  google:
    enabled: true
    web-client-id: test-client.apps.googleusercontent.com
    link-url: https://app.example.com/google-link
  auth:
    email-enabled: true
    from: no-reply@example.com
    verify-email-url: https://app.example.com/verify-email
    reset-password-url: https://app.example.com/reset-password
  jwt:
    secret-key: dGVzdC1vbmx5LWFjY2Vzcy1zaWduaW5nLWtleS0zMi1ieXRlcw==
    refresh-key: dGVzdC1vbmx5LXJlZnJlc2gtc2lnbmluZy1rZXktMzItYnl0ZXM=
application:
  ai:
    active-provider: mock
  weather:
    active-provider: mock

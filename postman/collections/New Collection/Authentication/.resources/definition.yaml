$kind: collection
scripts:
  - type: http:beforeRequest
    code: "// 1. Kiểm tra nếu HTTP status là 200 hoặc 201\r

      if (pm.response.code === 200 || pm.response.code === 201) {\r

      \    const jsonResponse = pm.response.json();\r

      \r

      \    if (jsonResponse && jsonResponse.data) {\r

      \        // Lưu Access Token\r

      \        if (jsonResponse.data.accessToken) {\r

      \            pm.environment.set(\"access_token\", jsonResponse.data.accessToken);\r

      \            pm.collectionVariables.set(\"access_token\", jsonResponse.data.accessToken);\r

      \            console.log(\"✅ Đã lưu access_token:\", jsonResponse.data.accessToken.substring(0, 25) + \"...\");\r

      \        }\r

      \r

      \        // Lưu Refresh Token\r

      \        if (jsonResponse.data.refreshToken) {\r

      \            pm.environment.set(\"refresh_token\", jsonResponse.data.refreshToken);\r

      \            pm.collectionVariables.set(\"refresh_token\", jsonResponse.data.refreshToken);\r

      \            console.log(\"✅ Đã lưu refresh_token:\", jsonResponse.data.refreshToken.substring(0, 25) + \"...\");\r

      \        }\r

      \    }\r

      }"
    language: text/javascript
order: 3372937162784767

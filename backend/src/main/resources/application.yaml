spring:
  application:
    name: travel-backend

  profiles:
    default: dev

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    refresh-key: ${JWT_REFRESH_KEY}

    access:
      expiration: 1800000 # 30 phút
    refresh:
      expiration: 604800000 # 7 ngày

  openapi:
    dev-url: ${OPENAPI_DEV_URL:http://localhost:${SERVER_PORT:8080}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
spring:
  application:
    name: travel-backend

  profiles:
    default: dev

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY:9a4f2c8d7e1b5a3f6c8e0d2b4a6f8c1d3e5a7b9c1d3e5f7a9b1c3d5e7f9a1b3c}
    refresh-key: ${JWT_REFRESH_KEY:7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c}

    access:
      expiration: 1800000 # 30 phút
    refresh:
      expiration: 604800000 # 7 ngày

  openapi:
    dev-url: ${OPENAPI_DEV_URL:http://localhost:${SERVER_PORT:8080}}

application:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ai:
    active-provider: ${AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:AQ.Ab8RN6JUDihPVm7bmxsX7MWAdHDZvdMIOD-HTIN0G6fHqFsIsQ}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout-seconds: 30
      temperature: 0.4
      max-output-tokens: 4096
  weather:
    active-provider: ${WEATHER_PROVIDER:open-meteo}
    open-meteo:
      base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1}
      timeout-seconds: 10
      default-timezone: Asia/Ho_Chi_Minh

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha